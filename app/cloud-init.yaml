#cloud-config
# Archivo: app/cloud-init.yaml
# Proposito: Aprovisionar automaticamente la aplicacion CaribeShop al iniciar cada VM (Requisito D3)

write_files:
  - path: /opt/caribeshop/server.py
    permissions: '0755'
    owner: root:root
    content: |
      #!/usr/bin/env python3
      import hashlib, json, os, socket, urllib.error, urllib.request
      from http.server import BaseHTTPRequestHandler, ThreadingHTTPServer

      PORT = 80
      UNHEALTHY_FLAG = "/tmp/unhealthy.flag"
      KEY_VAULT_NAME = os.environ.get("KEY_VAULT_NAME", "")
      SECRET_NAME = os.environ.get("SECRET_NAME", "db-connection-secret")

      def get_imds_metadata():
          url = "http://169.254.169.254/metadata/instance/compute?api-version=2021-02-01"
          req = urllib.request.Request(url, headers={"Metadata": "true"})
          try:
              with urllib.request.urlopen(req, timeout=2) as resp:
                  d = json.loads(resp.read().decode("utf-8"))
                  return {"vm_name": d.get("name", socket.gethostname()), "zone": d.get("zone", "N/A")}
          except Exception:
              return {"vm_name": socket.gethostname(), "zone": "local"}

      def fetch_secret_fingerprint():
          token_url = "http://169.254.169.254/metadata/identity/oauth2/token?api-version=2018-02-01&resource=https%3A%2F%2Fvault.azure.net"
          with urllib.request.urlopen(urllib.request.Request(token_url, headers={"Metadata": "true"}), timeout=3) as r:
              token = json.loads(r.read().decode("utf-8"))["access_token"]
          sec_url = f"https://{KEY_VAULT_NAME}.vault.azure.net/secrets/{SECRET_NAME}?api-version=7.4"
          with urllib.request.urlopen(urllib.request.Request(sec_url, headers={"Authorization": f"Bearer {token}"}), timeout=4) as r:
              val = json.loads(r.read().decode("utf-8")).get("value", "")
          return {
              "status": "OK",
              "key_vault": KEY_VAULT_NAME,
              "secret_name": SECRET_NAME,
              "secret_length": len(val),
              "sha256_fingerprint": hashlib.sha256(val.encode("utf-8")).hexdigest()[:12]
          }

      class Handler(BaseHTTPRequestHandler):
          def _json(self, code, data):
              b = json.dumps(data, indent=2).encode("utf-8")
              self.send_response(code)
              self.send_header("Content-Type", "application/json")
              self.send_header("Content-Length", str(len(b)))
              self.end_headers()
              self.wfile.write(b)

          def do_GET(self):
              meta = get_imds_metadata()
              if self.path == "/health":
                  if os.path.exists(UNHEALTHY_FLAG):
                      self._json(503, {"status": "UNHEALTHY", "instance": meta})
                  else:
                      self._json(200, {"status": "HEALTHY", "instance": meta})
                  return
              if self.path == "/secret-check":
                  try:
                      res = fetch_secret_fingerprint()
                      res["served_by"] = meta
                      self._json(200, res)
                  except Exception as e:
                      self._json(502, {"status": "ERROR", "detail": str(e), "served_by": meta})
                  return
              if self.path.startswith("/catalog"):
                  acc = sum((i * i) % 97 for i in range(1, 35000))
                  self._json(200, {"service": "CaribeShop", "checksum": acc, "served_by": meta})
                  return
              self._json(200, {"application": "CaribeShop", "status": "ONLINE", "served_by": meta})

          def log_message(self, format, *args):
              return

      if __name__ == "__main__":
          ThreadingHTTPServer(("0.0.0.0", PORT), Handler).serve_forever()

  - path: /etc/systemd/system/caribeshop.service
    permissions: '0644'
    owner: root:root
    content: |
      [Unit]
      Description=CaribeShop Web Application Service
      After=network-online.target
      Wants=network-online.target

      [Service]
      Type=simple
      Environment="KEY_VAULT_NAME=${key_vault_name}"
      Environment="SECRET_NAME=db-connection-secret"
      ExecStart=/usr/bin/python3 /opt/caribeshop/server.py
      Restart=always
      RestartSec=3

      [Install]
      WantedBy=multi-user.target

runcmd:
  - systemctl daemon-reload
  - systemctl enable caribeshop.service
  - systemctl start caribeshop.service
